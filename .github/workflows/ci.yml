name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test test.mjs
      - run: node --test test-cjs.cjs

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  pack-check:
    name: Pack check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify pack contents
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          grep -q "dist/index.cjs" pack-output.txt || (echo "Missing dist/index.cjs" && exit 1)
          grep -q "dist/index.mjs" pack-output.txt || (echo "Missing dist/index.mjs" && exit 1)
          grep -q "dist/index.d.ts" pack-output.txt || (echo "Missing dist/index.d.ts" && exit 1)
          grep -q "dist/index.d.mts" pack-output.txt || (echo "Missing dist/index.d.mts" && exit 1)
          grep -q "README.md" pack-output.txt || (echo "Missing README.md" && exit 1)
          grep -q "CHANGELOG.md" pack-output.txt || (echo "Missing CHANGELOG.md" && exit 1)
          grep -q "LICENSE" pack-output.txt || (echo "Missing LICENSE" && exit 1)
          ! grep -q "test.mjs" pack-output.txt || (echo "test.mjs should not be in pack" && exit 1)
          ! grep -q "node_modules" pack-output.txt || (echo "node_modules should not be in pack" && exit 1)
          echo "Pack contents verified."

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Coverage
        run: pnpm run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────────────────────────────
  # Hostile-timezone matrix.
  #
  # Three real bugs shipped in pray-calc 2.4.0's predecessor while its suite was
  # green at 134/135. They shipped because every suite ran in exactly one
  # timezone, on machines west of UTC. No amount of care in review substitutes
  # for running the tests somewhere else.
  #
  # The zones are chosen so each catches something the others cannot:
  #   UTC                 control
  #   America/New_York    west of UTC, observes DST
  #   Asia/Tokyo          east of UTC, no DST
  #   Pacific/Kiritimati  UTC+14 — the extreme that broke a seasonal index
  #   Etc/GMT+12          UTC-12 — the opposite extreme
  #   Pacific/Auckland    southern-hemisphere DST, catches transition bugs
  # ───────────────────────────────────────────────────────────────────────────
  timezones:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - America/New_York
          - Asia/Tokyo
          - Pacific/Kiritimati
          - Etc/GMT+12
          - Pacific/Auckland
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Confirm the runner is actually in the matrix zone
        run: |
          echo "TZ=$TZ"
          node -e "const z=Intl.DateTimeFormat().resolvedOptions().timeZone; console.log('resolved:', z); if (z !== process.env.TZ) { console.error('runner did not adopt TZ'); process.exit(1); }"
      - run: node --test test.mjs
      - run: node --test test-cjs.cjs
